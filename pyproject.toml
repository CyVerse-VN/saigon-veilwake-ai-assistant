[project]
name = "saigon-veilwake-ai-guide-service"
version = "0.1.0"
description = "AI Guide Service for Saigon: Veilwake"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "google-genai>=1.75,<2.0",
  "groq>=1.0,<2.0",
  "numpy>=1.24,<2.4",
  "sounddevice>=0.5,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
app = ["web/dev_voice/*.html", "web/dev_voice/*.css", "web/dev_voice/*.js"]
